name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # mvn verify 会先跑 surefire（JUnit 5：正确性 + 并发/锁专项），再打 jar
      - name: Build jar + sources jar (runs JUnit tests first)
        run: mvn -B -ntp verify

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp target/filebackedmap-*.jar release-assets/
          ls -lh release-assets/

      - name: Resolve version from tag
        id: ver
        run: echo "num=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FileBackedMap v${{ steps.ver.outputs.num }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.jar
          body: |
            ## FileBackedMap v${{ steps.ver.outputs.num }}

            **HashMap 的磁盘扩展**：`Map<String, String>` 实现，键值数据放磁盘文件、堆内只有内存索引，会话作用域（close 删文件、不做持久化）。

            ### 核心特性
            - 会话生命周期：打开对目标文件取独占锁（被占抛 `IOException`）并清空同名旧文件；close() 释放锁并删除数据文件（幂等）。数据只在会话内有效，重启后由应用重新加载。
            - 索引驻内存：开放定址三数组（状态/hash/偏移，13 B/槽），槽数 2 的幂、负载 2/3 翻倍；扩容 = 纯内存 rehash，零 I/O。
            - 数据文件 = 构造路径本身：无头、无校验字段，只追加 `[len][UTF-8]` 记录；写完即可读回（页缓存），**全程无 fsync**。
            - 无崩溃恢复 / 无垃圾整理 / 无 compact——定位就是「磁盘内存」，不是嵌入式数据库。
            - 键值长度无上限（单条记录约 2 GB 上限，总量受磁盘限制），支持 null 键 / null 值 / 空串 / 任意 Unicode。
            - 公开 API 面只有 `java.util.Map` 接口方法 + `close()`。

            ### 性能（100 万条，键值 100–1000 字符随机，Windows + NVMe，-Xmx256m）
            | 阶段 | 吞吐 | p50 延迟 |
            |---|---|---|
            | 插入 | 47,409 ops/s | 6.4 µs |
            | 修改 | 27,278 ops/s | 19.2 µs |
            | 查找 | 44,121 ops/s | 13.0 µs |
            | putAll 批量 | 44,663 ops/s | 9.2 µs |

            v0.1.1 增量：记录 I/O 块读化——读/更新/删除热路径 3 次 I/O 合并为 1 次整块读，查找 +63%、修改 +47%。

            磁盘 ≈ 1,056 MB（净载荷）；堆占用 29 MB（同规模 HashMap 为 1,183 MB，仅其 2.5%）。

            ### 构建与引用
            ```bash
            mvn package
            ```
            产物：`filebackedmap-${{ steps.ver.outputs.num }}.jar`（仅生产代码，不含测试类）与 `filebackedmap-${{ steps.ver.outputs.num }}-sources.jar`。

            Maven 坐标：`com.codedad:filebackedmap:${{ steps.ver.outputs.num }}`（Java 17+，生产零依赖）。

            ### 测试
            - `com.codedad.fbmap.test.FileBackedMapTest` —— JUnit 5 黑盒正确性测试（11 用例），与 `HashMap` 逐条对照
            - `com.codedad.fbmap.test.ConcurrencyTest` —— 并发与独占锁专项（8 用例）：读写锁、跨进程独占、回调重入、close 删文件

            详见 README。

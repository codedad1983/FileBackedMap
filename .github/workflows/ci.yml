name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # surefire 自动执行 JUnit 5 测试：
      #   FileBackedMapTest   11 个用例（与 HashMap 逐条对照）
      #   ConcurrencyTest      8 个用例（读写锁 / 跨进程独占锁 / close 删文件）
      - name: Build + test
        run: mvn -B -ntp verify

      - name: Show artifact
        run: ls -l target/*.jar

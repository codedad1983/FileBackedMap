name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # surefire 自动执行 JUnit 5 测试：
      #   FileBackedMapTest  9 个用例（与 HashMap 逐条对照）
      #   CrashSafetyTest    8 个用例（模拟半落盘 / 崩溃状态）
      - name: Build + test
        run: mvn -B -ntp verify

      - name: Show artifact
        run: ls -l target/*.jar
